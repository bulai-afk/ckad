# Основной домен: центр-каталогизации.рф (xn----8sbaaoishcaoovty5ae8dp.xn--p1ai)
# Зеркала (всегда 301 одним шагом на https://основной домен):
#   centrcatalog.ru, www.centrcatalog.ru, центркаталогизации.рф, www.центр-каталогизации.рф
#
# Сертификат Let's Encrypt (автопродление certbot.timer):
#   /etc/letsencrypt/live/ckad-all/*
# Копии для совместимости: /etc/ssl/ckad/* (синхронизируются deploy-hook)

# Punycode: заголовок Location должен быть ASCII.
map $host $ckad_canonical_host {
    default "xn----8sbaaoishcaoovty5ae8dp.xn--p1ai";
}

# Кириллическое зеркало без дефиса → основной домен по HTTP
server {
    listen 80;
    listen [::]:80;
    server_name
        xn--80aaalhpgcamnurx3ad5do.xn--p1ai
        www.xn--80aaalhpgcamnurx3ad5do.xn--p1ai
        центркаталогизации.рф
        www.центркаталогизации.рф;

    return 301 https://$ckad_canonical_host$request_uri;
}

# Латинское зеркало по HTTP → сразу основной домен по HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name
        centrcatalog.ru
        www.centrcatalog.ru;

    return 301 https://$ckad_canonical_host$request_uri;
}

# Основной домен: HTTP → HTTPS (без www)
server {
    listen 80;
    listen [::]:80;
    server_name
        xn----8sbaaoishcaoovty5ae8dp.xn--p1ai
        www.xn----8sbaaoishcaoovty5ae8dp.xn--p1ai
        центр-каталогизации.рф
        www.центр-каталогизации.рф;

    return 301 https://$ckad_canonical_host$request_uri;
}

# Прямой заход по IP — оставляем HTTP (для деплоя и отладки)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/ckad-proxy.inc;
}

# www → без www на HTTPS (.рф)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name
        www.xn----8sbaaoishcaoovty5ae8dp.xn--p1ai
        www.центр-каталогизации.рф;

    ssl_certificate /etc/letsencrypt/live/ckad-all/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ckad-all/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CKAD_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://$ckad_canonical_host$request_uri;
}

# Основной сайт по HTTPS (.рф)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name
        xn----8sbaaoishcaoovty5ae8dp.xn--p1ai
        центр-каталогизации.рф;

    ssl_certificate /etc/letsencrypt/live/ckad-all/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ckad-all/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CKAD_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/ckad-proxy.inc;
}

# Латинское зеркало по HTTPS → основной домен (сайт на этом хосте не отдаётся)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name
        centrcatalog.ru
        www.centrcatalog.ru;

    ssl_certificate /etc/letsencrypt/live/ckad-all/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ckad-all/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CKAD_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://$ckad_canonical_host$request_uri;
}
